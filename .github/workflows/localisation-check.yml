# Runs the check on every pull request that touches a localisation file, and
# fails the build if the candidate has blockers.
#
# The tool exits 1 on blockers and 2 on unreadable files, so the gate is just
# running it - there is no wrapper script and nothing to parse.

name: Localisation check

on:
  pull_request:
    paths:
      - "**/*.plist"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test the checker itself
        run: pytest -q

      # Blockers fail the build. HIGH findings do not: they mean "confirm this
      # was intentional", which is a human call. A gate that refuses those
      # teaches people to bypass the gate, and then it catches nothing.
      - name: Check the candidate against the release before it
        run: locheck localisations_1_2_0.plist localisations_1_2_1.plist --details

      # `if: always()` so the report is attached even when the step above failed,
      # which is exactly when somebody wants to read it.
      - name: Save the report
        if: always()
        run: locheck localisations_1_2_0.plist localisations_1_2_1.plist --json > report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: localisation-report
          path: report.json

  # Neither the author's machine nor the reviewer's necessarily has Docker - it
  # needs virtualisation enabled, which is often switched off on a work laptop.
  # So the image is built and exercised here instead of being documented on
  # trust. This job is the evidence that the Dockerfile works.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t locheck .

      - name: The entrypoint finds the mounted files on its own
        run: |
          docker run --rm -v "$PWD:/files" locheck --json > report.json
          python -c "import json,sys; d=json.load(open('report.json')); \
                     assert d['blocker_count'] == 4, d['blocker_count']; \
                     print('container produced the same', len(d['findings']), 'findings')"

      - name: Exit codes survive the container boundary
        run: |
          set +e
          docker run --rm -v "$PWD:/files" locheck --summary >/dev/null
          blocked=$?
          docker run --rm -v "$PWD:/files" locheck \
            localisations_1_2_0.plist localisations_1_2_0.plist >/dev/null
          clean=$?
          set -e
          echo "blockers -> $blocked, clean -> $clean"
          test "$blocked" = "1"
          test "$clean" = "0"
